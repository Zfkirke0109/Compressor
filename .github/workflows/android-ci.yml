name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list includes the legacy "tools" package, which
        # Google's SDK repository no longer serves (sdkmanager: "Failed to find package
        # 'tools'"), failing every run before anything builds. Request only what is used.
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Restore and validate shared signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPECTED_SIGNER_SHA256: ${{ secrets.EXPECTED_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS EXPECTED_SIGNER_SHA256; do
            test -n "${!secret}" || { echo "::error::Required secret $secret is not configured."; exit 1; }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > ci-debug.keystore
          chmod 600 ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          actual="$(keytool -exportcert -keystore ci-debug.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          expected="$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected" || { echo "::error::Signing certificate fingerprint mismatch."; exit 1; }

      - name: Build debug APK
        env:
          COMPRESSOR_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          COMPRESSOR_DEBUG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          COMPRESSOR_DEBUG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          COMPRESSOR_BUILD_NUMBER: ${{ github.run_number }}
          COMPRESSOR_BUILD_LABEL: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || 'main' }}
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain > gradle-build.log 2>&1

      - name: Verify 16 KB native page-size compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_native_alignment.py app/build/outputs/apk/debug/*.apk

      - name: Gate generated DEX method sizes
        run: python3 scripts/ci/verify_dex_method_budget.py app/build/outputs/apk/debug/*.apk

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain

      - name: Remove signing material from runner
        if: always()
        shell: bash
        run: rm -f ci-debug.keystore

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # The action's default package list includes the legacy "tools" package, which
        # Google's SDK repository no longer serves (sdkmanager: "Failed to find package
        # 'tools'"), failing every run before anything builds. Request only what is used.
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/

  # The analysis tooling decides what a capture is allowed to claim — which predicate rejected a
  # file, whether two runs are comparable at all. It was never covered by CI, so a broken
  # summariser could have silently mis-reported a device run. Each suite is self-running (no
  # pytest dependency) and imports by module name, so it runs from its own directory.
  diagnostics-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Run diagnostics and research test suites
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r test; do
            echo "::group::$test"
            ( cd "$(dirname "$test")" && python3 "$(basename "$test")" ) || failed=1
            echo "::endgroup::"
          done < <(git ls-files '*/test_*.py' | sort)
          test "$failed" -eq 0 || { echo "::error::One or more Python test suites failed."; exit 1; }

  offline-scoring-controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ref: 17a67b238ce0539bdeafdc95961abac64fa16ea8
            version: '3.0.0'
          - ref: 8e7a1ac4eb835a274fb32b2851e6db719fd10c7f
            version: '3.2.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Netflix/vmaf
          ref: ${{ matrix.ref }}
          path: vendor-vmaf
      - name: Install native scoring tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg meson ninja-build xxd
      - name: Build pinned Netflix scorer
        run: |
          meson setup vendor-vmaf/build vendor-vmaf/libvmaf --buildtype=release -Denable_asm=false -Denable_tests=false -Denable_docs=false -Denable_float=false -Dbuilt_in_models=true
          ninja -C vendor-vmaf/build
      - name: Run real offline controls (Android remains a separate device gate)
        env:
          COMPRESSOR_VMAF_VERSION: ${{ matrix.version }}
        run: |
          export COMPRESSOR_VMAF_BIN="$PWD/vendor-vmaf/build/tools/vmaf"
          export COMPRESSOR_VMAF_MODEL="$PWD/vendor-vmaf/model/vmaf_v0.6.1.json"
          python3 scripts/diagnostics/test_scoring_parity_integration.py
